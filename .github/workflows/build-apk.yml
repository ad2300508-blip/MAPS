name: Build Android APK

on:
  push:
    branches: [claude/nextgen-navigation-app-Rhq46, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Generate Android icons from public/icon-512.png
        run: |
          sudo apt-get install -y imagemagick -q
          SRC=public/icon-512.png
          RES=android/app/src/main/res
          convert "$SRC" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$SRC" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$SRC" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$SRC" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$SRC" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          # Round icons (foreground)
          cp "$RES/mipmap-mdpi/ic_launcher.png"    "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$RES/mipmap-hdpi/ic_launcher.png"    "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xhdpi/ic_launcher.png"   "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxhdpi/ic_launcher.png"  "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MAPS-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAPS-android-apk
          path: release/MAPS-android.apk
          retention-days: 30

      - name: Create/update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "MAPS Android — Latest Build"
          body: |
            ## Installa MAPS sul tuo Galaxy S25 Ultra

            ### Istruzioni (30 secondi)

            1. **Scarica** il file `MAPS-android.apk` qui sotto
            2. Sul telefono, apri il file scaricato dal **pannello notifiche** (Downloads)
            3. Se compare "App sconosciuta": tocca **Impostazioni** → attiva **Installa app sconosciute** → torna indietro
            4. Premi **Installa**
            5. Apri **MAPS** dal cassetto app — è lì, come Google Maps

            ---
            *Build automatica dal codice sorgente — nessuna dipendenza esterna, 100% gratuita.*
          files: release/MAPS-android.apk
          make_latest: true
